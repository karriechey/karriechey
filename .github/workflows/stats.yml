name: stats

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [update-stats]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          filename: profile/languages.svg
          token: ${{ secrets.STATS_TOKEN }}
          committer_token: ${{ github.token }}
          committer_message: update stats
          output_action: commit
          base: ""
          repositories_forks: no
          commits_authoring: karriechey, 155341695+karriechey@users.noreply.github.com, karriechey@gmail.com, robot@pi.local
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_colors: github
          plugin_languages_ignored: jupyter notebook

      - uses: lowlighter/metrics@v3.34
        with:
          filename: profile/calendar.svg
          token: ${{ secrets.STATS_TOKEN }}
          committer_token: ${{ github.token }}
          committer_message: update stats
          output_action: commit
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
